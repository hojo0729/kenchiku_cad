<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1f2933" />
    <title>建築CAD</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button data-action="line" class="tool active" title="線 (L)">線</button>
        <button data-action="endChain" title="連続線を終了 (Esc)">線を終了</button>
        <span class="sep"></span>
        <button data-action="undo" title="元に戻す (Ctrl+Z)">戻す</button>
        <button data-action="fit" title="全体表示 (F)">全体</button>
        <label class="grid-select">
          グリッド
          <select id="grid">
            <option value="910">910</option>
            <option value="455" selected>455</option>
            <option value="100">100</option>
            <option value="0">なし</option>
          </select>
        </label>
        <span class="sep"></span>
        <button data-action="clear" title="全消去">全消去</button>
        <button data-action="exportDxf" class="primary" title="DXFで保存">DXF保存</button>
      </header>
      <main class="stage">
        <canvas id="canvas"></canvas>
      </main>
      <footer class="status" id="status">準備完了</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
